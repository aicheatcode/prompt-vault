name: Deploy Prompt Vault

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release before touching production
        run: |
          node tests/test_apps_script_public_feed.cjs
          node tests/test_function.mjs
          node tests/test_home_editor.cjs
          node tests/test_independent_failure_cases.cjs
          node tests/test_publication_security.mjs
      - name: Install Google clasp
        run: npm install --global @google/clasp@3
      - name: Restore configured Google authentication
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs=require('node:fs');
          const credentials=process.env.CLASPRC_JSON;
          const scriptId=process.env.SCRIPT_ID;
          if(!credentials||!scriptId)throw Error('Google deployment authentication has not been configured. No Apps Script files were changed.');
          const parsed=JSON.parse(credentials);
          if(!parsed||typeof parsed!=='object'||Object.keys(parsed).length===0)throw Error('Invalid Google deployment authentication.');
          fs.writeFileSync(process.env.HOME+'/.clasprc.json',credentials,{mode:0o600});
          fs.writeFileSync('.clasp.json',JSON.stringify({scriptId,rootDir:'src',filePushOrder:['src/Code.gs','src/Catalog.gs']}),{mode:0o600});
          JS
      - name: Verify existing deployment belongs to configured script
        shell: bash
        run: |
          set -euo pipefail
          clasp list-deployments > /tmp/prompt-vault-deployments.txt
          node - <<'JS'
          const text=require('node:fs').readFileSync('/tmp/prompt-vault-deployments.txt','utf8');
          const expected='AKfycbwKfO8QxrDCCKbLdkk9SE421kCLpJeSEJvu43D9RTRGljg04gOlYRLXxyw6ovNXgmjkXg';
          if(!text.includes(expected))throw Error('Configured script does not contain the expected web app deployment. No source pushed.');
          console.log('Existing deployment verified.');
          JS
      - name: Update source and existing web app URL
        shell: bash
        run: |
          set -euo pipefail
          clasp push --force
          clasp create-deployment --deploymentId AKfycbwKfO8QxrDCCKbLdkk9SE421kCLpJeSEJvu43D9RTRGljg04gOlYRLXxyw6ovNXgmjkXg --description "Prompt Vault ${GITHUB_SHA:0:7}"
      - name: Verify live JSON feed
        run: node scripts/verify-live.mjs
      - name: Publish to configured Netlify project
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$NETLIFY_AUTH_TOKEN" || -z "$NETLIFY_SITE_ID" ]]; then
            echo "::error::NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID are required; frontend was NOT published."
            exit 1
          fi
          npx --yes netlify-cli deploy --prod --build --site "$NETLIFY_SITE_ID" --json
      - name: Remove runner credentials
        if: always()
        shell: bash
        run: rm -f "$HOME/.clasprc.json" .clasp.json /tmp/prompt-vault-deployments.txt
