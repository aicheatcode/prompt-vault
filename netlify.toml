[build]
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'none'; script-src 'sha256-0ZIz3BDiPc65prTkmDWG+bjf3hC51l3qdWwcoFy6mvs='; style-src 'sha256-hFqBBv4YC2oDX4itMtK8RMz74ypuwUiKNj1DYNtONvU=' 'sha256-n7XoqtRNSG7C2uuSEqp33H00rpl9PnJxisxBVsVhXfQ='; style-src-attr 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'"
